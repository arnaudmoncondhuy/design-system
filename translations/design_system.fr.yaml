# Catalogue du paquet, domaine « design_system ».
#
# Ces clés appartiennent au design system : le choix de palette, le lien d'évitement, les
# libellés de la vitrine. Une application ne les redéclare pas ; elle peut les surcharger en
# posant un fichier de même domaine dans ses propres traductions.

theme:
    label: Thème
    system: Selon mon système
    light: Clair
    dark: Sombre
    contrast: Contraste renforcé

skip:
    content: Aller au contenu

action:
    save: Enregistrer
    cancel: Annuler
    confirm: Confirmer
    close: Fermer
    edit: Modifier
    delete: Supprimer

# Ce qui suit ne sert qu'à la page /styleguide, absente de la production.
styleguide:
    title: Catalogue
    intro: Chaque composant du design system, dans chacun de ses états. Le menu en haut à droite change de palette — dont « Contraste renforcé », destinée à la basse vision.

    sidebar:
        label: Sections du catalogue

    section:
        tokens: Jetons
        typography: Typographie
        buttons: Boutons
        badges: Étiquettes
        cards: Cartes
        dashboard: Chiffres
        forms: Formulaires
        checks: Cases et choix
        tables: Tableaux
        alerts: Messages
        detail: Fiche et liste vide
        steps: Fil d'étapes
        navigation: Navigation
        layout: Charpente
        disclosure: Menu et accordéon
        modal: Fenêtre modale

    tokens:
        hint: les seuls noms qu'un composant a le droit d'employer
    buttons:
        hint: le ton porte le sens, la forme porte l'insistance
    badges:
        hint: teintée pour un état, pleine pour ce qui doit s'attraper de loin
    checks:
        hint: l'étiquette entoure la commande, et devient une zone de clic
    tables:
        hint: le tri, la ligne retenue et les actions passent par des attributs standards
    layout:
        hint: remplir le bloc « sidebar » suffit à passer en deux colonnes
        example: Exemple de menu latéral
        body: Le contenu prend la colonne qui reste. Sous 60 caractères de large, le menu repasse au-dessus.
    disclosure:
        hint: deux emplois du même élément, que le navigateur ouvre et ferme lui-même

    typography:
        hint: aucun composant n'écrit une taille ni une graisse
        sample: Portez ce vieux whisky au juge blond

    weight:
        medium: Texte appuyé
        semibold: Demi-gras
        bold: Gras
        heavy: Titre

    variant:
        solid: Plein
