        ghost: Discret

    size:
        small: Petit
        normal: Normal
        large: Grand

    state:
        disabled: Indisponible
        busy: En cours
        icon: Ajouter
        block: Pleine largeur

    tone:
        none: Sans ton
        neutral: Neutre
        accent: Accent
        success: Terminé
        warning: En attente
        danger: Échec
        info: Information

    card:
